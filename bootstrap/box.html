<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homework Grid Layout</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <h1 class="text-center text-danger mb-4">Homework</h1>

    <div class="row g-3">

        <!-- Box 1 -->
        <div class="col-12 col-sm-4 col-md-6 col-xl-12">
            <div class="bg-success text-white text-center p-3 rounded fs-4">1</div>
        </div>

        <!-- Box 2 -->
        <div class="col-12 col-sm-4 col-md-6 col-xl-12">
            <div class="bg-success text-white text-center p-3 rounded fs-4">2</div>
        </div>

        <!-- Box 3 -->
        <div class="col-12 col-sm-4 col-md-12 col-xl-3">
            <div class="bg-success text-white text-center p-3 rounded fs-4">3</div>
        </div>

        <!-- Box 4 -->
        <div class="col-12 col-sm-12 col-md-12 col-xl-3">
            <div class="bg-success text-white text-center p-3 rounded fs-4">4</div>
        </div>

        <!-- Box 5 -->
        <div class="col-12 col-sm-12 col-md-6 col-xl-3">
            <div class="bg-success text-white text-center p-3 rounded fs-4">5</div>
        </div>

        <!-- Box 6 -->
        <div class="col-12 col-sm-4 col-md-6 col-xl-3">
            <div class="bg-success text-white text-center p-3 rounded fs-4">6</div>
        </div>

        <!-- Box 7 -->
        <div class="col-12 col-sm-4 col-md-6 col-xl-12">
            <div class="bg-success text-white text-center p-3 rounded fs-4">7</div>
        </div>

        <!-- Box 8 -->
        <div class="col-12 col-sm-4 col-md-6 col-xl-12">
            <div class="bg-success text-white text-center p-3 rounded fs-4">8</div>
        </div>

    </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
