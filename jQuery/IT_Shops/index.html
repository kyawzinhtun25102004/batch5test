<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Shop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="../jquery-4.0.0.min.js"></script>
</head>
<body>

    <nav>
        <div class="logo">IT Shop</div>

        <ul>
            <li><a href="#">Home</a></li>
            <li class="cart">
                <i class="fa-solid fa-cart-shopping"></i>
                <span>0</span>
            </li>
        </ul>
    </nav>

    <div class="container">

        <div class="card">
            <img src="images/laptop.webp" alt="">
            <h3>Laptop 1</h3>
            <p>Price : 2300000 MMK</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="images/laptop1.webp" alt="">
            <h3>Laptop 2</h3>
            <p>Price : 2000000 MMK</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="images/laptop2.webp" alt="">
            <h3>Laptop 3</h3>
            <p>Price : 1900000 MMK</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="images/laptop3.webp" alt="">
            <h3>Laptop 4</h3>
            <p>Price : 1850000 MMK</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="images/ip14pro.webp" alt="">
            <h3>iPhone 1</h3>
            <p>Price : 3400000 MMK</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="images/ip14pro1.webp" alt="">
            <h3>iPhone 2</h3>
            <p>Price : 3200000 MMK</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="images/ip14pro2.webp" alt="">
            <h3>iPhone 3</h3>
            <p>Price : 3100000 MMK</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="images/ip14pro4.webp" alt="">
            <h3>iPhone 4</h3>
            <p>Price : 3000000 MMK</p>
            <button>Add to Cart</button>
        </div>

    </div>

</body>
</html>
