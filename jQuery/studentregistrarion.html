<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management</title>

    <script src="jquery-4.0.0.min.js"></script>
</head>

<body>

    <div id="addStudent">
        <h2 id="formTitle">Add New Student</h2>

        <input type="hidden" id="editIndex" value="-1">

        <label>Name :</label>
        <input type="text" id="name">
        <br><br>

        <label>Email :</label>
        <input type="email" id="email">
        <br><br>

        <label>Phone :</label>
        <input type="text" id="phone">
        <br><br>

        <label>Year :</label>
        <select id="year">
            <option value="">Choose Year</option>
            <option value="First Year">First Year</option>
            <option value="Second Year">Second Year</option>
            <option value="Third Year">Third Year</option>
        </select>

        <br><br>

        <button id="add">Add Student</button>
    </div>

    <hr>

    <h2>Students List</h2>

    <table border="1" cellspacing="0" cellpadding="15">
        <thead>
            <tr>
                <th>No.</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Year</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="tbody">

        </tbody>

    </table>

    <script>

        $(document).ready(function () {

            // Display data when page loads
            getData();

            // Add or Update Student
            $("#add").click(function () {

                let name = $("#name").val();
                let email = $("#email").val();
                let phone = $("#phone").val();
                let year = $("#year").val();
                let editIndex = $("#editIndex").val();

                // Validation
                if (name == "" || email == "" || phone == "" || year == "") {
                    alert("Please fill all fields.");
                    return;
                }

                let student = {
                    stu_name: name,
                    stu_email: email,
                    stu_phone: phone,
                    stu_year: year
                };

                // Get old data
                let studentData = localStorage.getItem("students_key");
                let studentArray = studentData == null ? [] : JSON.parse(studentData);

                if (editIndex == "-1") {
                    // Mode: Add new student
                    studentArray.push(student);
                } else {
                    // Mode: Update existing student
                    studentArray[editIndex] = student;
                }

                // Save again
                localStorage.setItem("students_key", JSON.stringify(studentArray));

                // Refresh table
                getData();

                // Clear form & Reset State
                clearForm();
            });


            // Display Students
            function getData() {

                let studentData = localStorage.getItem("students_key");
                let studentArray = studentData == null ? [] : JSON.parse(studentData);

                let data = "";
                let no = 1;

                $.each(studentArray, function (index, student) {

                    data += `
                    <tr>
                        <td>${no++}</td>
                        <td>${student.stu_name}</td>
                        <td>${student.stu_email}</td>
                        <td>${student.stu_phone}</td>
                        <td>${student.stu_year}</td>
                        <td>
                            <button class="edit" data-id="${index}">Edit</button>
                            <button class="delete" data-id="${index}">Delete</button>
                        </td>
                    </tr>
                    `;

                });

                $("#tbody").html(data);
            }


            // Edit Student (Populate Form)
            $(document).on("click", ".edit", function () {
                let index = $(this).data("id");
                let studentArray = JSON.parse(localStorage.getItem("students_key"));
                let student = studentArray[index];

                // Put data into inputs
                $("#name").val(student.stu_name);
                $("#email").val(student.stu_email);
                $("#phone").val(student.stu_phone);
                $("#year").val(student.stu_year);

                // Set edit tracking states
                $("#editIndex").val(index);
                $("#add").text("Update Student");
                $("#formTitle").text("Edit Student Details");
            });


            // Delete Student (With Confirmation)
            $(document).on("click", ".delete", function () {
                
                // If user is currently editing a student, prevent deleting to avoid index mismatches
                if($("#editIndex").val() !== "-1") {
                    alert("Please finish or clear your current edit before deleting records.");
                    return;
                }

                let ans = confirm("Are you sure you want to delete this student?");
                
                if (ans) {
                    let index = $(this).data("id");
                    let studentData = localStorage.getItem("students_key");
                    
                    if (studentData) {
                        let studentArray = JSON.parse(studentData);
                        studentArray.splice(index, 1);
                        
                        localStorage.setItem("students_key", JSON.stringify(studentArray));
                        getData();
                    }
                }
            });

            // Helper to clean fields and reset form state
            function clearForm() {
                $("#name").val("");
                $("#email").val("");
                $("#phone").val("");
                $("#year").val("");
                
                // Reset to Add Mode
                $("#editIndex").val("-1");
                $("#add").text("Add Student");
                $("#formTitle").text("Add New Student");
            }

        });

    </script>

</body>

</html>
